changelog:
  exclude:
    labels:
      - internal
      - skip-changelog
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - '*'
